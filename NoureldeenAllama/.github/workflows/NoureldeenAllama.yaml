name: build-workflow_NoureldeenAllama
run-name: Build Workflow for Noureldeen Allama
on:
  workflow_dispatch:
    inputs:
      env:
        type: choice
        default: qa
        options:
          - dev
          - prod  



jobs:
  prod-job:
    runs-on: ubuntu-latest
    if : github.event.inputs.env == 'prod'
    steps:
      - name: echo "This is the production job"
        run: echo "Running production job"

      - name: create file
        run: echo "This is a production file" > prod_file.txt

      - name: show file content
        run: cat prod_file.txt 